# ─── Dev Profile — Supabase PostgreSQL ───────────────────────────────────────
# Nilai diambil dari environment variable atau file .env yang diload
# via spring-dotenv / IDE run config / OS env
spring.config.import=optional:file:.env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate: Hibernate hanya verifikasi skema, tidak mengubahnya — Flyway yang bertanggung jawab
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── JWT ──────────────────────────────────────────────────────────────────────
skillbridge.app.jwtSecret=${JWT_SECRET}
skillbridge.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
skillbridge.app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ─── CORS ─────────────────────────────────────────────────────────────────────
skillbridge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
